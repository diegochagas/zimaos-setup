name: nextcloud
services:
    nextcloud:
        container_name: nextcloud
        deploy:
            resources:
                reservations:
                    memory: "536870912"
        image: nextcloud:33.0.3@sha256:80241648313b230e3546a8552260c17034a68b59c28271aecbf5317065bd0fd3
        labels:
            icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.nextcloud/assets/icon.svg
        network_mode: bridge
        ports:
            - target: 80
              published: "10081"
              protocol: tcp
            - target: 443
              published: "10443"
              protocol: tcp
        restart: unless-stopped
        volumes:
            - type: bind
              source: ${APPDATA_ROOT}/nextcloud/var/www/html
              target: /var/www/html
            - type: bind
              source: ${NEXTCLOUD_DATA_DIR}
              target: /var/www/html/data
x-casaos:
    app_id: org.icewhale.nextcloud
    hostname: ${SERVER_IP}
    icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.nextcloud/assets/icon.svg
    index: /
    is_uncontrolled: false
    main: nextcloud
    port_map: "10081"
    repo_id: zimaos-appstore
    scheme: http
    store_app_id: nextcloud
    title:
        custom: Nextcloud
        en_US: Nextcloud
    version: 33.0.3
