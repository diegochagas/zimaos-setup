name: swingmusic
services:
    swingmusic:
        container_name: swingmusic
        image: ghcr.io/swingmx/swingmusic:v2.1.4@sha256:ecef8036167876a7d6d81d3a9f0bcbd7641e334afda24b6c9666b1e00112a4ad
        labels:
            icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.swingmusic/assets/icon.svg
        networks:
            default: null
        ports:
            - mode: ingress
              target: 1970
              published: "1970"
              protocol: tcp
        restart: unless-stopped
        volumes:
            - type: bind
              source: ${APPDATA_ROOT}/swingmusic/config
              target: /config
            - type: bind
              source: ${DATA4TB_MOUNT}/Media/Music
              target: /music
networks:
    default:
        name: swingmusic_default
x-casaos:
    icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.swingmusic/assets/icon.svg
    id: org.icewhale.swingmusic
    index: /
    is_uncontrolled: false
    main: swingmusic
    port_map: "1970"
    repo_id: zimaos-appstore
    store_app_id: swingmusic
    title:
        en_US: Swing Music
        zh_CN: Swing Music
    version: 2.1.4
