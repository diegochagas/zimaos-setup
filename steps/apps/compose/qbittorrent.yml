name: qbittorrent
services:
    qbittorrent:
        container_name: qbittorrent
        deploy:
            resources:
                reservations:
                    memory: "268435456"
        environment:
            PGID: "${PGID}"
            PUID: "${PUID}"
            TZ: ${TZ}
            UMASK: "002"
        image: ghcr.io/hotio/qbittorrent:release-5.0.4@sha256:a4fabde0933301e08a6ea31e7826d883ca309c1d4748c8831c9423b5b08761df
        labels:
            icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.qbittorrent/assets/icon.svg
        network_mode: bridge
        ports:
            - target: 8080
              published: "8181"
              protocol: tcp
        restart: unless-stopped
        volumes:
            - type: bind
              source: ${APPDATA_ROOT}/qbittorrent/config
              target: /config
            - type: bind
              source: ${QBITTORRENT_DOWNLOADS_DIR}
              target: /DATA
x-casaos:
    app_id: org.icewhale.qbittorrent
    hostname: ${SERVER_IP}
    icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.qbittorrent/assets/icon.svg
    index: /
    is_uncontrolled: false
    main: qbittorrent
    port_map: "8181"
    repo_id: zimaos-appstore
    scheme: http
    store_app_id: qbittorrent
    title:
        custom: qBittorrent
        en_US: qBittorrent
    version: 5.0.4
