name: cloudflared
services:
    cloudflared:
        container_name: cloudflared
        image: wisdomsky/cloudflared-web:2026.5.0@sha256:436e073b6ff4a5a37ddfff3b6f8a3db736583286271beee664815e332ad55394
        labels:
            icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.cloudflared/assets/icon.svg
        network_mode: host
        ports:
            - target: 14333
              published: "14333"
              protocol: tcp
        restart: unless-stopped
        volumes:
            - type: bind
              source: ${APPDATA_ROOT}/casaos-cloudflared/config
              target: /config
x-casaos:
    app_id: org.icewhale.cloudflared
    icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.cloudflared/assets/icon.svg
    is_uncontrolled: false
    main: cloudflared
    port_map: "14333"
    repo_id: zimaos-appstore
    store_app_id: cloudflared
    title:
        en_US: Cloudflared
    version: 2026.5.0
