name: vaultwarden
services:
    vaultwarden:
        container_name: vaultwarden
        deploy:
            resources:
                reservations:
                    memory: "268435456"
        image: vaultwarden/server:1.36.0@sha256:ae4bcc7bf8ac933eb1854fe3b849c74bd94dffef56c2490f9fdeac0c3f916d92
        labels:
            icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.vaultwarden/assets/icon.svg
        network_mode: bridge
        ports:
            - target: 80
              published: "10380"
              protocol: tcp
        restart: unless-stopped
        volumes:
            - type: bind
              source: ${APPDATA_ROOT}/vaultwarden/data
              target: /data
x-casaos:
    app_id: org.icewhale.vaultwarden
    icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.vaultwarden/assets/icon.svg
    index: /
    is_uncontrolled: false
    main: vaultwarden
    port_map: "10380"
    repo_id: zimaos-appstore
    store_app_id: vaultwarden
    title:
        en_US: Vaultwarden
    version: 1.36.0
