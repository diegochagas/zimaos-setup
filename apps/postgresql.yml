name: postgresql
services:
    postgresql:
        container_name: postgresql
        deploy:
            resources:
                reservations:
                    memory: "2147483648"
        environment:
            PGID: "${PGID}"
            POSTGRES_DB: ${POSTGRESQL_DB}
            POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
            POSTGRES_USER: ${POSTGRESQL_USER}
            PUID: "${PUID}"
            TZ: ${TZ}
        image: postgres:17.4
        labels:
            icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.postgresql/assets/icon.svg
        networks:
            default: null
        ports:
            - target: 5432
              published: "5432"
              protocol: tcp
        restart: unless-stopped
        volumes:
            - type: bind
              source: ${APPDATA_ROOT}/postgresql/data
              target: /var/lib/postgresql/data
networks:
    default:
        name: postgresql_default
x-casaos:
    icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.postgresql/assets/icon.svg
    id: org.icewhale.postgresql
    is_uncontrolled: false
    main: postgresql
    repo_id: zimaos-appstore
    store_app_id: postgresql
    title:
        en_US: PostgreSQL
    version: 17.4.0
